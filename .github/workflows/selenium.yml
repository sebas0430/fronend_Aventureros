name: Selenium E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_Aventureros/package-lock.json

      - name: Instalar dependencias del frontend
        run: |
          cd frontend_Aventureros
          npm ci

      - name: Levantar el servidor frontend
        run: |
          cd frontend_Aventureros
          npm start &
        # el '&' manda el proceso a segundo plano para que el workflow continúe

      - name: Esperar a que el frontend responda
        run: |
          echo "Esperando que http://localhost:4200 responda..."
          while ! curl -s http://localhost:4200 > /dev/null; do
            echo "Aún no responde... esperando 2 segundos"
            sleep 2
          done
          echo "¡Frontend listo!"

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Pruebas Selenium
        # La variable CI=true es leída por DriverFactory para forzar modo headless
        env:
          CI: "true"
        run: |
          cd selenium-tests
          mvn test -Dapp.url=http://localhost:4200

      - name: Subir reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: selenium-tests/target/surefire-reports
